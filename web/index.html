<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#1c1013">
<title>CorkScrew – a script executor for Rokori on Android</title>
<meta name="description" content="CorkScrew is a script executor for Roblox on Android.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1c1013;
    --bg-2: #2b161b;
    --ink: #f4e8d6;
    --ink-dim: #c7b4a0;
    --cork: #d9a35f;
    --cork-deep: #b9824a;
    --wine: #8e2b4a;
    --glass: #5f9c7f;
    --line: #4a2a31;
    --serif: "Fraunces", Georgia, "Times New Roman", serif;
    --sans: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html { color-scheme: dark; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    background:
      radial-gradient(900px 520px at 50% 38%, var(--bg-2), transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.6;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    display: flex;
    flex-direction: column;
  }
  .wrap { width: min(1040px, 100% - 2.5rem); margin-inline: auto; }

  header .wrap {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1.4rem 0; border-bottom: 1px solid var(--line);
  }
  .brand { font-family: var(--serif); font-weight: 800; font-size: 1.6rem; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: .55rem; }
  .brand svg { width: 28px; height: 28px; }
  nav { display: flex; gap: 1.5rem; align-items: center; }
  nav a { color: var(--ink-dim); text-decoration: none; font-weight: 500; }
  nav a:hover { color: var(--ink); }

  main { flex: 1; display: grid; place-items: center; padding: 3rem 0 2rem; }
  .hero { text-align: center; display: grid; justify-items: center; gap: 1.4rem; }

  .coil { width: min(240px, 52vw); height: auto; overflow: visible; }

  h1 {
    font-family: var(--serif); font-weight: 800;
    font-size: clamp(2.6rem, 9vw, 5.2rem);
    line-height: 1.02; letter-spacing: -0.02em; max-width: 14ch;
  }
  h1 span { display: block; }
  h1 .l2 { color: var(--cork); }

  .sub { color: var(--ink-dim); max-width: 34ch; font-size: 1.2rem; }

  .actions { display: flex; flex-wrap: wrap; gap: .85rem; justify-content: center; margin-top: .4rem; }
  .btn {
    display: inline-flex; align-items: center; gap: .6rem;
    padding: .95rem 1.6rem; border-radius: 999px;
    font: 700 1.05rem var(--sans); text-decoration: none;
    border: 2px solid var(--cork); transition: transform .15s, background .15s, color .15s;
  }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.primary { background: var(--cork); color: #2a1408; }
  .btn.primary:hover { background: #e6b676; }
  .btn.ghost { color: var(--ink); }
  .btn.ghost:hover { background: rgba(217,163,95,.14); }
  .btn:active { transform: translateY(1px); }
  :focus-visible { outline: 3px solid var(--glass); outline-offset: 3px; }

  .version {
    display: inline-flex; align-items: center; gap: .6rem; flex-wrap: wrap; justify-content: center;
    color: var(--ink-dim); font-size: .98rem; margin-top: .6rem;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--glass); box-shadow: 0 0 0 4px rgba(95,156,127,.2); }
  .version b { color: var(--ink); font-weight: 700; }

  footer { border-top: 1px solid var(--line); color: var(--ink-dim); font-size: .88rem; }
  footer .wrap { padding: 1.2rem 0; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
  footer a { color: var(--ink-dim); }

  @media (max-width: 520px) { nav a.hide-sm { display: none; } .btn { width: 100%; justify-content: center; } .actions { width: 100%; } }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a class="brand" href="#top" id="top">
      <svg viewBox="0 0 32 32" aria-hidden="true" fill="none" stroke="#d9a35f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 5h20"/><path d="M16 5v6"/><path d="M11 14l10 3-10 4 10 4"/>
      </svg>
      CorkScrew
    </a>
    <nav>
      <a href="https://github.com/nivalox/CorkScrew/releases/latest" target="_blank" rel="noopener">Releases</a>
      <a href="https://discord.gg/VBpXt2subN" target="_blank" rel="noopener">Discord</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap hero">
    <svg class="coil" id="coil" viewBox="-100 0 200 230" aria-hidden="true"></svg>

    <h1><span>Small tool.</span><span class="l2">Sharp tip.</span></h1>
    <p class="sub">A script executor for Rokori on Android, kept simple.</p>

    <div class="actions">
      <a class="btn primary" href="https://github.com/nivalox/CorkScrew/releases/latest" target="_blank" rel="noopener">
        Download Latest Release
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 11l5 5 5-5"/><path d="M5 20h14"/></svg>
      </a>
      <a class="btn ghost" href="https://discord.gg/VBpXt2subN" target="_blank" rel="noopener">
        Join Discord
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 0 1-11.7 7L4 20l1.1-4A8 8 0 1 1 20 12z"/></svg>
      </a>
    </div>

    <p class="version" aria-live="polite">
      <span class="dot"></span>
      <span>CorkScrew <b id="v-cork">…</b> for Rokori <b id="v-rokori">…</b></span>
    </p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>CorkScrew is not affiliated with Rokori.</span>
    <a href="https://github.com/nivalox/CorkScrew" target="_blank" rel="noopener">GitHub</a>
  </div>
</footer>

<script>
  // Versions come from versions.txt in this same directory (/web).
  // Format, one per line:  CORK: 0.2.2   ROKORI: 2.742
  (async function () {
    const cork = document.getElementById('v-cork');
    const rokori = document.getElementById('v-rokori');
    try {
      const res = await fetch('versions.txt?t=' + Date.now(), { cache: 'no-store' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const map = {};
      (await res.text()).split(/\r?\n/).forEach(function (line) {
        const i = line.indexOf(':');
        if (i > 0) map[line.slice(0, i).trim().toUpperCase()] = line.slice(i + 1).trim();
      });
      cork.textContent = map.CORK || 'unknown';
      rokori.textContent = map.ROKORI || 'unknown';
    } catch (e) {
      cork.textContent = 'latest';
      rokori.textContent = 'latest';
    }
  })();

  // Hero corkscrew: a helix that slowly turns. Front strokes bright, back strokes dim.
  (function () {
    const svg = document.getElementById('coil');
    const NS = 'http://www.w3.org/2000/svg';
    const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    // Handle and shaft are static.
    const g = function (tag, attrs) {
      const el = document.createElementNS(NS, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      svg.appendChild(el);
      return el;
    };
    g('line', { x1: -46, y1: 14, x2: 46, y2: 14, stroke: '#d9a35f', 'stroke-width': 14, 'stroke-linecap': 'round' });
    g('line', { x1: 0, y1: 20, x2: 0, y2: 64, stroke: '#b9824a', 'stroke-width': 9, 'stroke-linecap': 'round' });
    const back = g('path', { fill: 'none', stroke: '#7a5a3a', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });
    const front = g('path', { fill: 'none', stroke: '#e6b676', 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

    const TURNS = 4.5, TOP = 70, HEIGHT = 150, STEPS = 140;
    function draw(phase) {
      let b = '', f = '';
      let prevFront = null;
      for (let s = 0; s <= STEPS; s++) {
        const u = s / STEPS;
        const t = u * TURNS * Math.PI * 2 + phase;
        const r = 44 * (1 - 0.72 * u);
        const x = r * Math.cos(t);
        const y = TOP + u * HEIGHT + r * 0.3 * Math.sin(t);
        const isFront = Math.sin(t) > 0;
        const pt = x.toFixed(1) + ' ' + y.toFixed(1);
        if (isFront) { f += (prevFront === true ? 'L' : 'M') + pt; }
        else { b += (prevFront === false ? 'L' : 'M') + pt; }
        prevFront = isFront;
      }
      back.setAttribute('d', b);
      front.setAttribute('d', f);
    }
    draw(0);
    if (still) return;
    let start = null;
    function tick(ts) {
      if (start === null) start = ts;
      draw(-(ts - start) / 1800);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
